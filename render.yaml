services:
  # FastAPI Backend on Render
  - type: web
    name: pension-seva-backend
    runtime: python
    plan: free
    rootDir: . # repo root (requirements.txt is at root)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_NAME
        value: Pension Seva Backend API
      - key: APP_VERSION
        value: 1.0.0
      # ---- Set these in the Render Dashboard (Secrets) instead of committing them ----
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: pension_seva
      - key: DB_NAME
        value: pension_seva
      - key: TRACEABILITY_DATABASE_URL
        value: sqlite:////tmp/traceability.sqlite3
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true # Render auto-generates a secure random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL after frontend deploy
      - key: MAX_FILE_SIZE_BYTES
        value: 10485760
      - key: OCR_LANGUAGES
        value: eng
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract # Tesseract is preinstalled on Render's Python image
      - key: OTP_PROVIDER
        value: email
      - key: OTP_EXPIRY_SECONDS
        value: "120"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_SSL
        value: "true"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

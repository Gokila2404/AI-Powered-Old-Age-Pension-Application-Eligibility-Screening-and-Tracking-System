services:
  # FastAPI Backend on Render
  - type: web
    name: pension-seva-backend
    runtime: python
    plan: free
    rootDir: . # repo root (requirements.txt is at root)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_NAME
        value: Pension Seva Backend API
      - key: APP_VERSION
        value: 1.0.0
      # ---- Set these in the Render Dashboard (Secrets) instead of committing them ----
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: pension_seva
      - key: DB_NAME
        value: pension_seva
      - key: TRACEABILITY_DATABASE_URL
        value: sqlite:////tmp/traceability.sqlite3
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true # Render auto-generates a secure random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL after frontend deploy
      - key: MAX_FILE_SIZE_BYTES
        value: 10485760
      - key: OCR_LANGUAGES
        value: eng
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract # Tesseract is preinstalled on Render's Python image
      - key: OTP_PROVIDER
        value: email
      - key: OTP_EXPIRY_SECONDS
        value: "300"   # 5 minutes
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_REQUESTS_PER_HOUR
        value: "5"
      - key: LOGIN_OTP_REQUIRED
        value: "true"
      - key: ALLOW_CONSOLE_OTP_FALLBACK
        value: "false"  # Must be false in production — forces real email delivery
      # ---- Resend API (leave blank unless you have a verified domain at resend.com/domains) ----
      # Without domain verification Resend only delivers to its own account email (403 for others).
      # Gmail SMTP below is the primary delivery channel.
      - key: RESEND_API_KEY
        value: ""
      # ---- Gmail SMTP — primary OTP delivery on Render ----
      # Render Free allows outbound port 587 (STARTTLS). Port 465 (SSL) may be blocked.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"    # STARTTLS — works on Render Free tier
      - key: SMTP_USE_SSL
        value: "false"  # false = STARTTLS on port 587
      - key: SMTP_USE_TLS
        value: "true"   # true = enable STARTTLS
      - key: SMTP_USER
        sync: false     # set in Render Dashboard: suga240406@gmail.com
      - key: SMTP_PASSWORD
        sync: false     # set in Render Dashboard: Gmail App Password (16 chars, no spaces)
      - key: SMTP_FROM_EMAIL
        sync: false     # set in Render Dashboard: suga240406@gmail.com
      - key: GEMINI_API_KEY
        sync: false
